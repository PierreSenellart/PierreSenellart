name: Update README cards

on:
  push:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # Self-computed stats card (see .github/scripts/gen_stats.py). It replaced
      # the github-readme-stats card on 2026-07-27: GitHub's GraphQL API stopped
      # serving `stargazers` to tokens without an explicit grant on the target
      # repo, which broke every card that project renders. The REST endpoints
      # this script uses still work with the default GITHUB_TOKEN.
      - name: Generate stats card
        run: python3 .github/scripts/gen_stats.py profile/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # github-linguist is used by gen_top_langs.py to count lines of code per
      # language while honouring each repo's .gitattributes (charlock_holmes, a
      # dependency, needs cmake + libicu-dev to build). Line counting is
      # best-effort: if this step is removed the card simply drops the LOC column.
      - name: Install github-linguist
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libicu-dev
          sudo gem install github-linguist

      # Self-computed "Most Used Languages" donut (see .github/scripts/gen_top_langs.py):
      # honest percentages, an "Other" slice, per-language LOC, and colours we control.
      # Repos annotate generated/vendored/test content via their own .gitattributes,
      # which both the /languages API (bytes/percentages) and github-linguist (LOC) honour.
      - name: Generate top languages card
        run: python3 .github/scripts/gen_top_langs.py profile/top-langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push

name: Update README cards

on:
  push:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=donut&langs_count=6&hide=jupyter+notebook,html,typescript,javascript,css,roff"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # The donut layout emits stroke="null" for languages GitHub Linguist has no
      # colour for (e.g. Lean), leaving an invisible slice. Paint those a Lean-ish
      # colour so they show up on the circle.
      - name: Colour uncoloured donut slices (e.g. Lean)
        run: sed -i 's/stroke="null"/stroke="#4C21FF"/g' profile/top-langs.svg

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: repo=provsql
          path: profile/pin-provsql.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: repo=apxproof
          path: profile/pin-apxproof.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
